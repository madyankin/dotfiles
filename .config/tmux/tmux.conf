set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g base-index 1

# COLORTERM has to reach panes or mc's truecolor skin silently falls back.
set -ga update-environment " COLORTERM"

# No default-command: reattach-to-user-namespace is obsolete on modern macOS
# and, when the binary is absent, every pane dies the instant it spawns.

bind C-c run "tmux show-buffer | pbcopy"
bind C-v run "pbpaste | tmux load-buffer - && tmux paste-buffer"

setw -g mouse on

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

bind -r C-h run "tmux select-pane -L"
bind -r C-j run "tmux select-pane -D"
bind -r C-k run "tmux select-pane -U"
bind -r C-l run "tmux select-pane -R"

bind C-l send-keys 'C-l'

bind V split-window -h
bind H split-window

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# open/split window with the same path as the current one
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Generated by scripts/theme.sh. Absent until the first render, hence -q.
source-file -q ~/.config/tmux/theme.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
