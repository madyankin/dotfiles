<main class="shell">
  <header class="meta"><span>Deutsch · Sprechen</span><span class="badge">{{Level}} · {{Topic}}</span></header>
  <section class="paper">
    <div class="label">Готовая фраза</div>
    <div class="answer" lang="de">{{Answer}}</div>
    <div class="translation">{{Prompt}}</div>
    {{#Audio}}<div class="audio">{{Audio}}</div>{{/Audio}}
    {{#Pattern}}<div class="detail"><div class="label">Конструкция</div><div class="pattern" lang="de">{{Pattern}}</div>
    {{#Rule}}<div class="rule">{{Rule}}</div>{{/Rule}}</div>{{/Pattern}}
  </section>
  <div class="footer">{{#Accept}}Также верно: {{Accept}}{{/Accept}}</div>
</main>
